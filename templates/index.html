<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Posture & Fall Detection</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #0b1220;
      color: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #172033;
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 1.6rem;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
    }
    .btn {
      display: block;
      padding: 14px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    .btn-capture {
      background: #16a34a;
      color: #ffffff;
    }
    .btn-capture:hover {
      background: #15803d;
    }
    .btn-dashboard {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-dashboard:hover {
      background: #1d4ed8;
    }
    .info {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #64748b;
      border-top: 1px solid #28354f;
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Live Posture Monitor</h1>
    <p>Real-time pose estimation and posture stability tracking powered by YOLO11.</p>
    <div class="btn-group">
      <a href="/capture" class="btn btn-capture">📱 Open Camera (/capture)</a>
      <a href="/dashboard" class="btn btn-dashboard">🖥️ Open Dashboard (/dashboard)</a>
    </div>
    <div class="info">
      Open <strong>/capture</strong> on your phone camera, and view the annotated stream on <strong>/dashboard</strong>.
    </div>
  </div>
</body>
</html>
