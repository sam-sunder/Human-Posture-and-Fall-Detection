<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KineticGuard — Camera Node</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || 'light';
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-[#0c0e14] text-slate-900 dark:text-[#f1f3f7] min-h-screen flex flex-col font-sans antialiased selection:bg-blue-600 selection:text-white transition-colors duration-150">

  <div class="flex-1 max-w-lg w-full mx-auto p-4 sm:p-6 flex flex-col justify-between space-y-4">
    
    <!-- Header -->
    <header class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-white/[0.08]">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-md bg-slate-100 dark:bg-[#181d2c] border border-slate-200 dark:border-white/[0.08] flex items-center justify-center text-blue-600 dark:text-blue-400">
          <i data-lucide="camera" class="w-4 h-4"></i>
        </div>
        <div>
          <h1 class="text-xs font-semibold text-slate-900 dark:text-[#f1f3f7]">Camera node</h1>
          <p class="text-[11px] text-slate-500 dark:text-[#6e768b]">Optical telemetry input</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="themeToggleBtn" onclick="toggleTheme()" class="h-7 px-2 rounded bg-slate-100 dark:bg-[#181d2c] border border-slate-200 dark:border-white/[0.08] hover:bg-slate-200 dark:hover:bg-[#20263a] text-xs text-slate-700 dark:text-[#9ba3b5] flex items-center gap-1 transition-colors">
          <i data-lucide="moon" id="themeIcon" class="w-3.5 h-3.5"></i>
        </button>
        <a href="/dashboard" class="h-7 px-2.5 rounded bg-slate-100 dark:bg-[#181d2c] border border-slate-200 dark:border-white/[0.08] hover:bg-slate-200 dark:hover:bg-[#20263a] text-xs text-slate-700 dark:text-[#9ba3b5] hover:text-slate-900 dark:hover:text-[#f1f3f7] transition-colors flex items-center gap-1.5">
          <i data-lucide="layout-dashboard" class="w-3.5 h-3.5"></i>
          <span>Dashboard</span>
        </a>
      </div>
    </header>

    <!-- Patient Selection -->
    <div class="rounded-xl bg-white dark:bg-[#121520] border border-slate-200 dark:border-white/[0.08] p-4 space-y-2.5 shadow-sm dark:shadow-none">
      <div>
        <label for="patientSelect" class="block text-xs text-slate-600 dark:text-[#9ba3b5] mb-1">Assigned patient and bed</label>
        <select id="patientSelect" onchange="onPatientChange()" class="w-full h-8 px-2.5 rounded-md bg-slate-50 dark:bg-[#181d2c] border border-slate-200 dark:border-white/[0.08] text-xs text-slate-900 dark:text-[#f1f3f7] focus:outline-none focus:border-blue-500 transition-colors">
          <option value="">Fetching patient list…</option>
        </select>
      </div>

      <div id="patientDetails" class="text-xs text-slate-500 dark:text-[#6e768b] pt-2 border-t border-slate-100 dark:border-white/[0.06] leading-relaxed">
        Select a patient to bind this camera stream
      </div>
    </div>

    <!-- Telemetry Status Bar -->
    <div class="grid grid-cols-2 gap-2.5">
      <div class="rounded-lg bg-white dark:bg-[#121520] border border-slate-200 dark:border-white/[0.08] px-3 py-2 flex items-center justify-between shadow-sm dark:shadow-none">
        <span class="text-xs text-slate-500 dark:text-[#6e768b]">Capture rate</span>
        <span class="text-xs font-mono font-medium text-emerald-600 dark:text-emerald-400" id="fpsStat">0.0 FPS</span>
      </div>
      <div class="rounded-lg bg-white dark:bg-[#121520] border border-slate-200 dark:border-white/[0.08] px-3 py-2 flex items-center justify-between shadow-sm dark:shadow-none">
        <span class="text-xs text-slate-500 dark:text-[#6e768b]">Network RTT</span>
        <span class="text-xs font-mono font-medium text-slate-700 dark:text-[#9ba3b5]" id="latencyStat">-- ms</span>
      </div>
    </div>

    <!-- Video Canvas Viewport -->
    <div class="relative w-full aspect-video bg-black rounded-lg overflow-hidden border border-slate-200 dark:border-white/[0.08] flex items-center justify-center">
      <video id="preview" autoplay playsinline muted class="w-full h-full object-cover"></video>
      <canvas id="canvas" class="hidden"></canvas>

      <!-- Pill Overlay -->
      <div class="absolute bottom-2 left-2 right-2 flex items-center justify-between pointer-events-none text-[11px] font-mono">
        <div id="statusPill" class="px-2 py-0.5 rounded bg-black/60 backdrop-blur-sm border border-white/[0.08] text-[#9ba3b5] flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-slate-500" id="statusDot"></span>
          <span id="statusText">Camera standby</span>
        </div>
        <div class="px-2 py-0.5 rounded bg-black/60 backdrop-blur-sm border border-white/[0.08] text-[#6e768b]">
          480p &bull; ACK flow
        </div>
      </div>
    </div>

    <!-- Action Controls -->
    <div class="grid grid-cols-2 gap-2.5 pt-1">
      <button id="startBtn" onclick="start()" class="h-9 rounded-md bg-slate-900 text-white hover:bg-slate-800 dark:bg-[#f1f3f7] dark:text-[#0c0e14] dark:hover:bg-white text-xs font-medium flex items-center justify-center gap-1.5 transition-colors disabled:opacity-40 disabled:pointer-events-none">
        <i data-lucide="play" class="w-3.5 h-3.5"></i>
        <span>Start camera</span>
      </button>
      <button id="stopBtn" onclick="stopStreaming(true)" disabled class="h-9 rounded-md bg-slate-100 hover:bg-slate-200 dark:bg-[#181d2c] dark:hover:bg-[#20263a] text-xs text-red-600 dark:text-red-400 border border-slate-200 dark:border-white/[0.08] flex items-center justify-center gap-1.5 transition-colors disabled:opacity-40 disabled:pointer-events-none">
        <i data-lucide="square" class="w-3.5 h-3.5"></i>
        <span>Stop stream</span>
      </button>
    </div>

    <div class="text-center text-[11px] text-slate-500 dark:text-[#6e768b] pt-1">
      Keep screen awake while monitoring bedside
    </div>

  </div>

  <script>
    let stream = null;
    let ws = null;
    let waitingForAck = false;
    let lastSendTimestamp = 0;
    let frameCounter = 0;
    let lastFpsCalculation = performance.now();
    let captureLoopTimer = null;
    let patients = [];
    let selectedClientId = null;

    const video = document.getElementById('preview');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: false });
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const fpsStat = document.getElementById('fpsStat');
    const latencyStat = document.getElementById('latencyStat');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const patientSelect = document.getElementById('patientSelect');
    const patientDetails = document.getElementById('patientDetails');

    const urlParams = new URLSearchParams(window.location.search);
    const initialClientId = urlParams.get('client_id');

    function initTheme() {
      const theme = localStorage.getItem('theme') || 'light';
      updateThemeUI(theme);
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      const nextTheme = isDark ? 'light' : 'dark';
      if (nextTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      localStorage.setItem('theme', nextTheme);
      updateThemeUI(nextTheme);
    }

    function updateThemeUI(theme) {
      const icon = document.getElementById('themeIcon');
      if (icon) {
        icon.setAttribute('data-lucide', theme === 'dark' ? 'sun' : 'moon');
        icon.className = theme === 'dark' ? 'w-3.5 h-3.5 text-amber-400' : 'w-3.5 h-3.5 text-slate-600';
      }
      if (window.lucide) lucide.createIcons();
    }

    async function loadPatients() {
      try {
        const res = await fetch('/api/patients');
        patients = await res.json();
        if (!patients.length) {
          patientSelect.innerHTML = '<option value="">No registered patients</option>';
          patientDetails.innerHTML = 'Register a patient in the <a href="/dashboard" class="text-blue-600 dark:text-blue-400 hover:underline">Dashboard</a> to start streaming.';
          return;
        }

        patientSelect.innerHTML = patients.map(p => {
          const selected = (initialClientId && p.client_id === initialClientId) ? 'selected' : '';
          return `<option value="${escapeHtml(p.client_id)}" ${selected}>${escapeHtml(p.name)} (${escapeHtml(p.room_number)}) — ID: ${escapeHtml(p.client_id)}</option>`;
        }).join('');

        onPatientChange();
      } catch (err) {
        patientSelect.innerHTML = '<option value="">Error loading patients</option>';
      }
    }

    function onPatientChange() {
      selectedClientId = patientSelect.value;
      const patient = patients.find(p => p.client_id === selectedClientId);
      if (patient) {
        patientDetails.innerHTML = `
          <div class="text-slate-900 dark:text-[#f1f3f7] font-medium">${escapeHtml(patient.name)} &bull; ${escapeHtml(patient.room_number)}</div>
          <div class="text-[11px] text-slate-500 dark:text-[#6e768b] mt-0.5 font-mono">Assigned key: ${escapeHtml(patient.client_id)}</div>
        `;
      }
    }

    async function start() {
      if (stream) return;
      if (!selectedClientId) {
        alert('Please select a registered patient first.');
        return;
      }

      try {
        startBtn.disabled = true;
        patientSelect.disabled = true;
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${proto}//${location.host}/ws/capture/${encodeURIComponent(selectedClientId)}`);

        ws.onopen = () => {
          statusText.textContent = `Live: ${selectedClientId}`;
          statusDot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500';
          stopBtn.disabled = false;
          waitingForAck = false;
          requestNextFrame(0);
        };

        ws.onmessage = (event) => {
          if (event.data === 'ack') {
            const rtt = Math.round(performance.now() - lastSendTimestamp);
            latencyStat.textContent = `${rtt} ms`;
            waitingForAck = false;
            requestNextFrame(0);
          }
        };

        ws.onclose = () => {
          statusText.textContent = 'Disconnected';
          statusDot.className = 'w-1.5 h-1.5 rounded-full bg-red-500';
          stopStreaming(false);
        };

        ws.onerror = () => {
          statusText.textContent = 'Socket error';
          statusDot.className = 'w-1.5 h-1.5 rounded-full bg-red-500';
        };
      } catch (err) {
        startBtn.disabled = false;
        patientSelect.disabled = false;
        alert('Camera access error: ' + err.message);
      }
    }

    function requestNextFrame(delayMs = 0) {
      if (captureLoopTimer) clearTimeout(captureLoopTimer);
      captureLoopTimer = setTimeout(captureAndSend, delayMs);
    }

    function captureAndSend() {
      if (!video.videoWidth || !ws || ws.readyState !== WebSocket.OPEN) {
        return;
      }

      const now = performance.now();

      if (waitingForAck && (now - lastSendTimestamp > 1000)) {
        waitingForAck = false;
      }

      if (waitingForAck || ws.bufferedAmount > 0) {
        requestNextFrame(20);
        return;
      }

      const elapsed = now - lastSendTimestamp;
      if (elapsed < 60) {
        requestNextFrame(60 - elapsed);
        return;
      }

      const targetWidth = Math.min(480, video.videoWidth);
      const targetHeight = Math.round(video.videoHeight * targetWidth / video.videoWidth);
      canvas.width = targetWidth;
      canvas.height = targetHeight;

      ctx.drawImage(video, 0, 0, targetWidth, targetHeight);
      waitingForAck = true;
      lastSendTimestamp = performance.now();

      canvas.toBlob((blob) => {
        if (blob && ws && ws.readyState === WebSocket.OPEN) {
          blob.arrayBuffer().then((buffer) => {
            if (ws.bufferedAmount === 0) {
              ws.send(buffer);
              updateFpsCounter();
            } else {
              waitingForAck = false;
              requestNextFrame(20);
            }
          }).catch(() => {
            waitingForAck = false;
            requestNextFrame(30);
          });
        } else {
          waitingForAck = false;
          requestNextFrame(30);
        }
      }, 'image/jpeg', 0.65);
    }

    function updateFpsCounter() {
      frameCounter++;
      const now = performance.now();
      const duration = now - lastFpsCalculation;
      if (duration >= 1000) {
        fpsStat.textContent = `${((frameCounter * 1000) / duration).toFixed(1)} FPS`;
        frameCounter = 0;
        lastFpsCalculation = now;
      }
    }

    function stopStreaming(closeSocket = true) {
      if (captureLoopTimer) {
        clearTimeout(captureLoopTimer);
        captureLoopTimer = null;
      }
      if (closeSocket && ws) {
        ws.close();
        ws = null;
      }
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.srcObject = null;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      patientSelect.disabled = false;
      waitingForAck = false;
      if (closeSocket) {
        statusText.textContent = 'Camera standby';
        statusDot.className = 'w-1.5 h-1.5 rounded-full bg-slate-400';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    initTheme();
    loadPatients();
    lucide.createIcons();
  </script>
</body>
</html>
