<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera Stream — Clinical Posture & Fall Detection</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    main {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.4rem;
      margin: 0 0 10px 0;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: 600;
    }
    select {
      width: 100%;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .stats-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 0.85rem;
    }
    .badge {
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 6px;
      color: #93c5fd;
      border: 1px solid #334155;
    }
    .btn-group {
      margin: 12px 0;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    #start { background: #16a34a; color: white; }
    #stop { background: #dc2626; color: white; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    video {
      width: 100%;
      background: #000;
      border-radius: 10px;
      margin-top: 10px;
      aspect-ratio: 4 / 3;
      object-fit: cover;
    }
    .status {
      padding: 10px 14px;
      background: #0f172a;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 0.9rem;
      border-left: 4px solid #3b82f6;
    }
    .nav-links {
      margin-top: 18px;
      font-size: 0.85rem;
    }
    a { color: #60a5fa; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>📱 Clinical Camera Capture</h1>

    <div class="card">
      <label for="patientSelect">Select Target Patient / Room</label>
      <select id="patientSelect" onchange="onPatientChange()">
        <option value="">Loading registered patients…</option>
      </select>
      <div id="patientDetails" style="font-size:13px; color:#cbd5e1; line-height:1.4;">
        Loading patient profile…
      </div>
    </div>

    <div class="stats-bar">
      <div class="badge" id="fpsStat">FPS: 0</div>
      <div class="badge" id="latencyStat">Latency: -- ms</div>
    </div>

    <div class="btn-group">
      <button id="start">▶ Start Streaming</button>
      <button id="stop" disabled>⏹ Stop</button>
    </div>

    <div class="status" id="status">Select patient and click Start Streaming.</div>
    <video id="preview" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none"></canvas>

    <div class="nav-links">
      <a href="/dashboard">← Back to Patient Dashboard</a>
    </div>
  </main>

  <script>
    let stream = null;
    let ws = null;
    let waitingForAck = false;
    let lastSendTimestamp = 0;
    let frameCounter = 0;
    let lastFpsCalculation = performance.now();
    let captureLoopTimer = null;
    let patients = [];
    let selectedClientId = null;

    const video = document.getElementById('preview');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: false });
    const statusEl = document.getElementById('status');
    const fpsStat = document.getElementById('fpsStat');
    const latencyStat = document.getElementById('latencyStat');
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    const patientSelect = document.getElementById('patientSelect');
    const patientDetails = document.getElementById('patientDetails');

    // Parse URL query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const initialClientId = urlParams.get('client_id');

    async function loadPatients() {
      try {
        const res = await fetch('/api/patients');
        patients = await res.json();
        if (!patients.length) {
          patientSelect.innerHTML = '<option value="">No registered patients</option>';
          patientDetails.textContent = 'Please register a patient on the dashboard first.';
          return;
        }

        patientSelect.innerHTML = patients.map(p => {
          const selected = (initialClientId && p.client_id === initialClientId) ? 'selected' : '';
          return `<option value="${escapeHtml(p.client_id)}" ${selected}>${escapeHtml(p.name)} (${escapeHtml(p.room_number)}) - ${escapeHtml(p.client_id)}</option>`;
        }).join('');

        onPatientChange();
      } catch (err) {
        patientSelect.innerHTML = '<option value="">Error loading patients</option>';
      }
    }

    function onPatientChange() {
      selectedClientId = patientSelect.value;
      const patient = patients.find(p => p.client_id === selectedClientId);
      if (patient) {
        patientDetails.innerHTML = `<strong>Patient:</strong> ${escapeHtml(patient.name)} &bull; <strong>Room:</strong> ${escapeHtml(patient.room_number)} &bull; <strong>Client ID:</strong> <code>${escapeHtml(patient.client_id)}</code><br><span style="color:#94a3b8;">${escapeHtml(patient.notes || 'No special clinical notes')}</span>`;
      }
    }

    async function start() {
      if (stream) return;
      if (!selectedClientId) {
        alert('Please select a patient before starting the stream.');
        return;
      }

      try {
        startBtn.disabled = true;
        patientSelect.disabled = true;
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${proto}//${location.host}/ws/capture/${encodeURIComponent(selectedClientId)}`);

        ws.onopen = () => {
          statusEl.textContent = `Connected! Streaming camera for ${selectedClientId} with zero-lag flow control.`;
          statusEl.style.borderLeftColor = '#16a34a';
          stopBtn.disabled = false;
          waitingForAck = false;
          requestNextFrame(0);
        };

        ws.onmessage = (event) => {
          if (event.data === 'ack') {
            const rtt = Math.round(performance.now() - lastSendTimestamp);
            latencyStat.textContent = `Latency: ${rtt} ms`;
            waitingForAck = false;
            requestNextFrame(0);
          }
        };

        ws.onclose = () => {
          statusEl.textContent = 'WebSocket disconnected.';
          statusEl.style.borderLeftColor = '#dc2626';
          stopStreaming(false);
        };

        ws.onerror = () => {
          statusEl.textContent = 'WebSocket connection error.';
          statusEl.style.borderLeftColor = '#dc2626';
        };
      } catch (err) {
        startBtn.disabled = false;
        patientSelect.disabled = false;
        statusEl.textContent = 'Camera error: ' + err.message;
        statusEl.style.borderLeftColor = '#dc2626';
      }
    }

    function requestNextFrame(delayMs = 0) {
      if (captureLoopTimer) clearTimeout(captureLoopTimer);
      captureLoopTimer = setTimeout(captureAndSend, delayMs);
    }

    function captureAndSend() {
      if (!video.videoWidth || !ws || ws.readyState !== WebSocket.OPEN) {
        return;
      }

      const now = performance.now();

      // Recovery: unlock if ACK delayed > 1000ms
      if (waitingForAck && (now - lastSendTimestamp > 1000)) {
        waitingForAck = false;
      }

      if (waitingForAck || ws.bufferedAmount > 0) {
        requestNextFrame(20);
        return;
      }

      const elapsed = now - lastSendTimestamp;
      if (elapsed < 60) {
        requestNextFrame(60 - elapsed);
        return;
      }

      const targetWidth = Math.min(480, video.videoWidth);
      const targetHeight = Math.round(video.videoHeight * targetWidth / video.videoWidth);
      canvas.width = targetWidth;
      canvas.height = targetHeight;

      ctx.drawImage(video, 0, 0, targetWidth, targetHeight);
      waitingForAck = true;
      lastSendTimestamp = performance.now();

      canvas.toBlob((blob) => {
        if (blob && ws && ws.readyState === WebSocket.OPEN) {
          blob.arrayBuffer().then((buffer) => {
            if (ws.bufferedAmount === 0) {
              ws.send(buffer);
              updateFpsCounter();
            } else {
              waitingForAck = false;
              requestNextFrame(20);
            }
          }).catch(() => {
            waitingForAck = false;
            requestNextFrame(30);
          });
        } else {
          waitingForAck = false;
          requestNextFrame(30);
        }
      }, 'image/jpeg', 0.65);
    }

    function updateFpsCounter() {
      frameCounter++;
      const now = performance.now();
      const duration = now - lastFpsCalculation;
      if (duration >= 1000) {
        fpsStat.textContent = `FPS: ${((frameCounter * 1000) / duration).toFixed(1)}`;
        frameCounter = 0;
        lastFpsCalculation = now;
      }
    }

    function stopStreaming(closeSocket = true) {
      if (captureLoopTimer) {
        clearTimeout(captureLoopTimer);
        captureLoopTimer = null;
      }
      if (closeSocket && ws) {
        ws.close();
        ws = null;
      }
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.srcObject = null;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      patientSelect.disabled = false;
      waitingForAck = false;
      if (closeSocket) {
        statusEl.textContent = 'Streaming stopped.';
        statusEl.style.borderLeftColor = '#3b82f6';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    startBtn.onclick = start;
    stopBtn.onclick = () => stopStreaming(true);
    window.addEventListener('beforeunload', () => stopStreaming(true));

    loadPatients();
  </script>
</body>
</html>
